[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daser"
version = "0.1.0"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "msgpack>=1.0",
    "pydantic>=2.0",
    "transformers>=4.40",
    "uvicorn[standard]>=0.29",
    "xxhash>=3.4",
]

[project.optional-dependencies]
dev = [
    "tomli>=2.0; python_version<'3.11'",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
]
service = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "transformers>=4.40",
    "uvicorn[standard]>=0.29",
]
integration = [
    "cupy-cuda12x>=13.0",
    "kvikio>=24.10",
    "tilelang>=0.1.10",
    "torch>=2.5",
]
bench = [
    "numpy>=1.26",
    "torch>=2.5",
]

[tool.setuptools.packages.find]
include = ["daser*"]

[tool.setuptools.package-data]
"daser.server.http" = ["static/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "SLF", "I"]

[tool.ruff.lint.isort]
known-first-party = ["daser"]
force-sort-within-sections = true

[tool.mypy]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
tmp_path_retention_policy = "none"
tmp_path_retention_count = 0
markers = [
    "integration: requires GPU, vLLM, GDS/cupy/kvikio, model weights, or a DaseR server (deselect with -m 'not integration')",
    "slow: slow tests excluded from quick runs (deselect with -m 'not slow')",
]
