name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff lint
        run: ruff check daser/ tests/

      - name: ruff format
        run: ruff format --check daser/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run CPU unit tests
        env:
          PYTHONHASHSEED: "0"
        run: >
          pytest -q
          -m "not integration"
          --ignore=tests/integration
          --ignore=tests/connector/test_daser_connector.py
          --ignore=tests/connector/test_gds_transfer.py
          tests/
